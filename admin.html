<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="painel">

<p class="voltar"><a href="resgate.html">Gerenciar itens e validar resgates →</a></p>

<h1>Administrador</h1>

<input
id="telefone"
type="text"
placeholder="Telefone ou email">

<button onclick="buscarUsuario()">
Buscar
</button>

<hr>

<h2 id="nome">
Nenhum usuário
</h2>

<p>

Telefone:
<span id="tel"></span>

</p>

<p>

Email:
<span id="email"></span>

</p>

<p>

Pontos:

<span id="points">0</span>

</p>

<input
id="valor"
type="number"
placeholder="Quantidade de pontos">

<textarea
id="motivo"
placeholder="Motivo"></textarea>

<button onclick="adicionarPontos()">
Adicionar Pontos
</button>

<button onclick="removerPontos()">
Remover Pontos
</button>

</div>

<!-- SDK do Firebase (precisa vir ANTES de qualquer script que use firebase.*) -->
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

<!-- Configuração + inicialização do Firebase -->
<script src="../firebase-config.js"></script>

<!-- Scripts da página (ordem importa: admin.js inicializa auth/db antes dos demais) -->
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="buscarUsuario.js"></script>
<script src="pontos.js"></script>

</body>
</html>
