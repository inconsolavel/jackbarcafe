<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="painel">

<h1>Administrador</h1>

<input
id="email"
type="email"
placeholder="E-mail do usuário">

<button onclick="buscarUsuario()">
Buscar
</button>

<hr>

<h2 id="nome">
Nenhum usuário
</h2>

<p>

E-mail:
<span id="tel"></span>

</p>

<p>

Pontos:

<span id="points">0</span>

</p>

<input
id="valor"
type="number"
placeholder="Quantidade de pontos">

<textarea
id="motivo"
placeholder="Motivo"></textarea>

<button onclick="adicionarPontos()">
Adicionar Pontos
</button>

<button onclick="removerPontos()">
Remover Pontos
</button>

</div>

<!--
  CORREÇÃO: faltavam os SDKs do Firebase (app/auth/firestore). Sem eles,
  o objeto global `firebase` nem existe, e todo script abaixo que o usa
  (auth.js, buscarUsuario.js, pontos.js) quebra silenciosamente no console.
-->
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

<script src="../firebase-config.js"></script>

<!-- CORREÇÃO: admin.js estava incluído duas vezes -->
<script src="admin.js"></script>

<script src="auth.js"></script>

<script src="buscarUsuario.js"></script>

<script src="pontos.js"></script>

</body>
</html>
