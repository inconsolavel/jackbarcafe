<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jack Ride</title>
  <style>
    :root {
      --canvas-w: 400;
      --canvas-h: 600;
      --pad: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background-image: url('fundo.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 0;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    #score {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: clamp(16px, 3vw, 20px);
      background: rgba(0,0,0,0.55);
      padding: 8px 10px;
      border-radius: 10px;
      pointer-events: auto;
    }

    #ranking {
      position: absolute;
      top: 10px;
      left: 10px;
      width: min(260px, calc(100vw - 24px));
      background: rgba(0,0,0,0.62);
      padding: 10px;
      border-radius: 10px;
      pointer-events: auto;
      max-height: 42vh;
      overflow: auto;
    }

    #ranking h3 { margin: 0 0 8px; font-size: 1rem; }
    #ranking ol { 
      margin: 0; 
      padding-left: 20px;
      list-style: none;
      counter-reset: ranking-counter;
    }
    #ranking li { 
      margin-bottom: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      counter-increment: ranking-counter;
      position: relative;
      padding-left: 30px;
    }
    #ranking li::before {
      content: counter(ranking-counter);
      position: absolute;
      left: 4px;
      color: #ffd27a;
      font-weight: bold;
      font-size: 0.8rem;
      min-width: 20px;
    }
    #ranking li:nth-child(1) { 
      background: rgba(255, 215, 0, 0.15); 
      border-left: 3px solid #ffd700;
    }
    #ranking li:nth-child(2) { 
      background: rgba(192, 192, 192, 0.12); 
      border-left: 3px solid #c0c0c0;
    }
    #ranking li:nth-child(3) { 
      background: rgba(205, 127, 50, 0.12); 
      border-left: 3px solid #cd7f32;
    }
    #ranking .rank-score {
      font-weight: bold;
      color: #ffd27a;
    }
    #ranking .rank-player {
      color: #fff;
    }
    #ranking .rank-empty {
      color: #888;
      text-align: center;
      padding: 10px;
      font-style: italic;
    }

    .game-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      z-index: 2;
    }

    canvas {
      display: block;
      background: rgba(34,34,34,0.88);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      width: min(92vw, calc((100svh - 80px) * 0.6667));
      height: auto;
      max-height: 84svh;
      aspect-ratio: 2 / 3;
      touch-action: none;
    }

    .controls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      display: none;
      gap: 10px;
      z-index: 4;
    }

    .ctrl-btn {
      min-width: 64px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .top-actions {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      z-index: 4;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 24px);
    }

    .btn {
      pointer-events: auto;
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .gameover {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      z-index: 5;
      padding: 16px;
    }

    .gameover-card {
      background: #1f1f1f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 20px;
      width: min(360px, 100%);
      text-align: center;
    }

    .gameover-card h2 { margin: 0 0 8px; color: #ff4d4d; }
    .gameover-card p { margin: 0 0 14px; color: #ddd; }
    .gameover-card .btn { width: 100%; background: #ff0000; }

    @media (max-width: 900px) {
      #ranking { max-width: 180px; font-size: 0.9rem; }
      #ranking h3 { font-size: 0.95rem; }
      #ranking li { font-size: 0.8rem; padding-left: 26px; }
      .controls { display: flex; }
      canvas { width: min(96vw, 420px); max-height: 72svh; }
    }

    @media (max-width: 520px) {
      #ranking {
        top: auto;
        bottom: 76px;
        left: 10px;
        width: calc(100vw - 20px);
        max-width: none;
        max-height: 120px;
      }
      #ranking li { font-size: 0.75rem; padding: 2px 6px 2px 26px; }
      #score { top: 54px; right: 10px; font-size: 15px; }
      .top-actions { top: 8px; }
      .controls { bottom: 10px; }
      .ctrl-btn { min-width: 86px; height: 50px; }
      canvas { max-height: 60svh; }
    }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>

  <div class="hud">
    <div id="score">Score: 0</div>
    <div id="ranking">
      <h3>🏆 Top 10</h3>
      <ol id="rankingList">
        <li class="rank-empty">Carregando ranking...</li>
      </ol>
    </div>
  </div>

  <div class="top-actions">
    <button class="btn" id="pauseBtn" type="button">⏸ Pausar</button>
    <a class="btn" href="index.html" style="text-decoration:none;">🏠 Voltar</a>
  </div>

  <div class="game-shell">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="controls" role="group" aria-label="Controles de toque">
    <button class="ctrl-btn" id="leftBtn" type="button">◀</button>
    <button class="ctrl-btn" id="rightBtn" type="button">▶</button>
  </div>

  <div class="gameover" id="gameOverPanel">
    <div class="gameover-card">
      <h2>💀 Fim de jogo</h2>
      <p id="finalScoreText">Sua pontuação: 0</p>
      <button class="btn" id="restartBtn" type="button">🔄 Jogar novamente</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSXdOu9Cwly0-s9rySbe9jKb7fqhcz1p8",
      authDomain: "jackbarcafe-b8fa8.firebaseapp.com",
      projectId: "jackbarcafe-b8fa8",
      storageBucket: "jackbarcafe-b8fa8.appspot.com",
      messagingSenderId: "849215333925",
      appId: "1:849215333925:web:e02cb0d11c590af32201cc"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userId = null;
    let userEmail = 'Anônimo';

    // Autenticação - Tenta pegar o nome do usuário se estiver logado
    auth.onAuthStateChanged(user => { 
      if (user) {
        userId = user.uid;
        // Tenta buscar o nome do usuário no Firestore
        db.collection('users').doc(user.uid).get()
          .then(doc => {
            if (doc.exists) {
              const data = doc.data();
              userEmail = data.nome || data.email || 'Anônimo';
            }
          })
          .catch(() => {});
      }
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const rankingList = document.getElementById('rankingList');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let score = 0;
    let speed = 2;
    let gameOver = false;
    let paused = false;
    let lastSpawnAt = 0;
    const SPAWN_INTERVAL_MS = 1200;

    const player = { x: 175, y: 520, w: 50, h: 80, color: 'red' };
    const cars = [];

    let leftPressed = false;
    let rightPressed = false;
    let pointerActive = false;

    function resetGame() {
      score = 0;
      speed = 2;
      gameOver = false;
      paused = false;
      lastSpawnAt = 0;
      cars.length = 0;
      player.x = 175;
      player.y = 520;
      scoreEl.innerText = 'Score: 0';
      gameOverPanel.style.display = 'none';
      pauseBtn.textContent = '⏸ Pausar';
      requestAnimationFrame(loop);
    }

    function spawnCar() {
      const car = {
        x: Math.random() * 350,
        y: -100,
        w: 50,
        h: 80,
        color: 'blue'
      };
      cars.push(car);
    }

    function movePlayer() {
      if (leftPressed) player.x -= 5;
      if (rightPressed) player.x += 5;
      player.x = Math.max(0, Math.min(350, player.x));
    }

    function update() {
      if (gameOver || paused) return;

      movePlayer();
      score += 1;
      scoreEl.innerText = `Score: ${score}`;
      speed = 2 + Math.floor(score / 200);

      for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i];
        car.y += speed;

        if (car.y > 600) {
          cars.splice(i, 1);
          continue;
        }

        if (
          car.x < player.x + player.w &&
          car.x + car.w > player.x &&
          car.y < player.y + player.h &&
          car.y + car.h > player.y
        ) {
          gameOver = true;
          finalScoreText.textContent = `Sua pontuação: ${score}`;
          gameOverPanel.style.display = 'flex';
          saveScore(score);
          break;
        }
      }
    }

    function drawRoadGuides() {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(130, 0, 6, canvas.height);
      ctx.fillRect(264, 0, 6, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      const dashH = 24;
      const gap = 16;
      const offset = (score * 0.8) % (dashH + gap);
      for (let y = -dashH; y < canvas.height + dashH; y += dashH + gap) {
        ctx.fillRect(197, y + offset, 6, dashH);
      }
    }

    function drawCarRect(obj, color) {
      ctx.fillStyle = color;
      ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(obj.x + 6, obj.y + 8, obj.w - 12, 10);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(obj.x + 6, obj.y + obj.h - 14, obj.w - 12, 8);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(34,34,34,0.94)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawRoadGuides();

      drawCarRect(player, player.color);
      for (const car of cars) drawCarRect(car, car.color);

      if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ PAUSADO', canvas.width / 2, canvas.height / 2);
      }
    }

    function loop(ts) {
      if (gameOver) {
        draw();
        return;
      }

      if (!paused) {
        if (!lastSpawnAt) lastSpawnAt = ts;
        if (ts - lastSpawnAt >= SPAWN_INTERVAL_MS) {
          spawnCar();
          lastSpawnAt = ts;
        }
        update();
      }

      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') leftPressed = true;
      if (e.key === 'ArrowRight') rightPressed = true;
      if (e.key.toLowerCase() === 'p') togglePause();
    });

    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') leftPressed = false;
      if (e.key === 'ArrowRight') rightPressed = false;
    });

    function bindHoldButton(btn, setter, direction) {
      const on = (ev) => { ev.preventDefault(); setter(true); };
      const off = (ev) => { ev.preventDefault(); setter(false); };
      ['pointerdown','touchstart','mousedown'].forEach(evt => btn.addEventListener(evt, on, { passive: false }));
      ['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(evt => btn.addEventListener(evt, off, { passive: false }));
    }

    bindHoldButton(document.getElementById('leftBtn'), v => { leftPressed = v; if (v) rightPressed = false; }, 'left');
    bindHoldButton(document.getElementById('rightBtn'), v => { rightPressed = v; if (v) leftPressed = false; }, 'right');

    function pointerToCanvasX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      return Math.max(0, Math.min(canvas.width, x));
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerActive = true;
      canvas.setPointerCapture?.(e.pointerId);
      const x = pointerToCanvasX(e.clientX);
      player.x = Math.max(0, Math.min(350, x - player.w / 2));
      e.preventDefault();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointerActive) return;
      const x = pointerToCanvasX(e.clientX);
      player.x = Math.max(0, Math.min(350, x - player.w / 2));
      e.preventDefault();
    });

    canvas.addEventListener('pointerup', () => { pointerActive = false; });
    canvas.addEventListener('pointercancel', () => { pointerActive = false; });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ Continuar' : '⏸ Pausar';
    }

    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);

    // ===== SALVAR PONTUAÇÃO COM NOME DO USUÁRIO =====
    function saveScore(scoreValue) {
      if (!userId) {
        loadRanking();
        return;
      }

      const ref = db.collection('gameScores').doc(userId);
      
      // Primeiro verifica se já existe uma pontuação maior
      ref.get().then(doc => {
        const currentScore = doc.exists ? doc.data().score : 0;
        
        // Só salva se a nova pontuação for maior
        if (scoreValue > currentScore) {
          return ref.set({ 
            score: scoreValue, 
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            nome: userEmail || 'Anônimo'
          }, { merge: true });
        }
        return Promise.resolve();
      }).catch(console.error).finally(() => {
        // Recarrega o ranking após salvar
        loadRanking();
      });
    }

    // ===== CARREGAR RANKING =====
    function loadRanking() {
      db.collection('gameScores')
        .orderBy('score', 'desc')
        .limit(10)
        .get()
        .then(snapshot => {
          rankingList.innerHTML = '';
          
          if (snapshot.empty) {
            rankingList.innerHTML = '<li class="rank-empty">Nenhuma pontuação ainda. Seja o primeiro! 🎮</li>';
            return;
          }
          
          let pos = 1;
          snapshot.forEach(doc => {
            const data = doc.data() || {};
            const nome = data.nome || 'Anônimo';
            const score = data.score || 0;
            const li = document.createElement('li');
            
            // Ícones para os top 3
            let medal = '';
            if (pos === 1) medal = '🥇 ';
            else if (pos === 2) medal = '🥈 ';
            else if (pos === 3) medal = '🥉 ';
            
            li.innerHTML = `
              <span class="rank-player">${medal}${nome}</span>
              <span class="rank-score">${score} pts</span>
            `;
            rankingList.appendChild(li);
            pos++;
          });
        })
        .catch(err => {
          console.error('Erro ao carregar ranking:', err);
          rankingList.innerHTML = '<li class="rank-empty">❌ Erro ao carregar ranking</li>';
        });
    }

    // ===== LISTENER EM TEMPO REAL PARA O RANKING =====
    function ouvirRanking() {
      db.collection('gameScores')
        .orderBy('score', 'desc')
        .limit(10)
        .onSnapshot(snapshot => {
          rankingList.innerHTML = '';
          
          if (snapshot.empty) {
            rankingList.innerHTML = '<li class="rank-empty">Nenhuma pontuação ainda. Seja o primeiro! 🎮</li>';
            return;
          }
          
          let pos = 1;
          snapshot.forEach(doc => {
            const data = doc.data() || {};
            const nome = data.nome || 'Anônimo';
            const score = data.score || 0;
            const li = document.createElement('li');
            
            let medal = '';
            if (pos === 1) medal = '🥇 ';
            else if (pos === 2) medal = '🥈 ';
            else if (pos === 3) medal = '🥉 ';
            
            li.innerHTML = `
              <span class="rank-player">${medal}${nome}</span>
              <span class="rank-score">${score} pts</span>
            `;
            rankingList.appendChild(li);
            pos++;
          });
        }, err => {
          console.error('Erro no listener do ranking:', err);
        });
    }

    // ===== INICIALIZAR =====
    // Carrega o ranking uma vez
    loadRanking();
    
    // Depois de 2 segundos, ativa o listener em tempo real
    setTimeout(() => {
      ouvirRanking();
    }, 2000);
    
    // Inicia o jogo
    requestAnimationFrame(loop);

    // Se o usuário fizer login depois, atualiza o nome
    auth.onAuthStateChanged(user => {
      if (user) {
        db.collection('users').doc(user.uid).get()
          .then(doc => {
            if (doc.exists) {
              const data = doc.data();
              userEmail = data.nome || data.email || 'Anônimo';
            }
          })
          .catch(() => {});
      }
    });

    console.log('🏎️ Jack Ride - Corrida de Carros!');
    console.log('📊 Ranking atualizado em tempo real!');
  </script>
</body>
</html>
