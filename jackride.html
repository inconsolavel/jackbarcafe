<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jack Ride</title>
  <style>
    :root {
      --canvas-w: 400;
      --canvas-h: 600;
      --pad: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background-image: url('fundo.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 0;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    #score {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: clamp(16px, 3vw, 20px);
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: auto;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #ranking {
      position: absolute;
      top: 10px;
      left: 10px;
      width: min(280px, calc(100vw - 24px));
      background: rgba(0,0,0,0.75);
      padding: 12px 14px;
      border-radius: 12px;
      pointer-events: auto;
      max-height: 45vh;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
    }

    #ranking h3 { 
      margin: 0 0 10px; 
      font-size: 0.95rem;
      color: #ffd27a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 8px;
    }
    #ranking h3 .refresh-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      color: #aaa;
      border-radius: 5px;
      padding: 2px 10px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
    }
    #ranking h3 .refresh-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    #ranking ol { 
      margin: 0; 
      padding-left: 0;
      list-style: none;
    }
    #ranking li { 
      margin-bottom: 3px;
      padding: 5px 8px 5px 30px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      position: relative;
      transition: 0.2s;
    }
    #ranking li::before {
      content: attr(data-pos);
      position: absolute;
      left: 6px;
      color: #888;
      font-weight: bold;
      font-size: 0.75rem;
      min-width: 20px;
    }
    #ranking li:nth-child(1) { 
      background: rgba(255, 215, 0, 0.12); 
      border-left: 3px solid #ffd700;
    }
    #ranking li:nth-child(1)::before { color: #ffd700; }
    #ranking li:nth-child(2) { 
      background: rgba(192, 192, 192, 0.10); 
      border-left: 3px solid #c0c0c0;
    }
    #ranking li:nth-child(2)::before { color: #c0c0c0; }
    #ranking li:nth-child(3) { 
      background: rgba(205, 127, 50, 0.10); 
      border-left: 3px solid #cd7f32;
    }
    #ranking li:nth-child(3)::before { color: #cd7f32; }
    
    .rank-score {
      font-weight: bold;
      color: #ffd27a;
      font-size: 0.9rem;
    }
    .rank-player {
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 140px;
    }
    .rank-medal {
      margin-right: 4px;
    }
    .rank-empty {
      color: #666;
      text-align: center;
      padding: 15px;
      font-style: italic;
    }
    .rank-loading {
      color: #666;
      text-align: center;
      padding: 15px;
    }

    .game-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      z-index: 2;
    }

    canvas {
      display: block;
      background: rgba(34,34,34,0.92);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      width: min(92vw, calc((100svh - 80px) * 0.6667));
      height: auto;
      max-height: 84svh;
      aspect-ratio: 2 / 3;
      touch-action: none;
    }

    .controls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      display: none;
      gap: 12px;
      z-index: 4;
    }

    .ctrl-btn {
      min-width: 70px;
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }
    .ctrl-btn:active {
      background: rgba(255,255,255,0.15);
      transform: scale(0.95);
    }

    .top-actions {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      z-index: 4;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 24px);
    }

    .btn {
      pointer-events: auto;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
      backdrop-filter: blur(4px);
      font-size: 0.9rem;
    }
    .btn:hover {
      background: rgba(255,255,255,0.12);
    }
    .btn:active {
      transform: scale(0.95);
    }

    .gameover {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      z-index: 5;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .gameover-card {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 28px 24px;
      width: min(360px, 100%);
      text-align: center;
    }

    .gameover-card h2 { margin: 0 0 8px; color: #ff4d4d; font-size: 1.6rem; }
    .gameover-card p { margin: 0 0 18px; color: #ddd; font-size: 1.1rem; }
    .gameover-card .btn { 
      width: 100%; 
      background: #ff0000; 
      padding: 14px;
      font-size: 1rem;
    }
    .gameover-card .btn:hover { background: #cc0000; }

    .user-info {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 4;
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .user-info strong {
      color: #ffd27a;
    }

    @media (max-width: 900px) {
      #ranking { max-width: 200px; font-size: 0.85rem; padding: 8px 10px; }
      #ranking li { font-size: 0.78rem; padding: 4px 6px 4px 26px; }
      .controls { display: flex; }
      canvas { width: min(96vw, 420px); max-height: 72svh; }
    }

    @media (max-width: 520px) {
      #ranking {
        top: auto;
        bottom: 76px;
        left: 10px;
        width: calc(100vw - 20px);
        max-width: none;
        max-height: 110px;
        padding: 8px 10px;
      }
      #ranking li { font-size: 0.7rem; padding: 3px 4px 3px 24px; }
      #ranking li .rank-player { max-width: 80px; }
      #score { top: 54px; right: 10px; font-size: 14px; padding: 6px 12px; }
      .top-actions { top: 8px; }
      .controls { bottom: 10px; gap: 8px; }
      .ctrl-btn { min-width: 80px; height: 48px; font-size: 1.1rem; }
      canvas { max-height: 58svh; }
      .user-info { bottom: 65px; font-size: 0.7rem; padding: 4px 14px; }
    }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>

  <div class="hud">
    <div id="score">🏁 0</div>
    <div id="ranking">
      <h3>
        🏆 TOP 10
        <button class="refresh-btn" onclick="carregarRanking()">🔄</button>
      </h3>
      <ol id="rankingList">
        <li class="rank-loading">⏳ Carregando...</li>
      </ol>
    </div>
  </div>

  <div class="top-actions">
    <button class="btn" id="pauseBtn" type="button">⏸️ Pausar</button>
    <a class="btn" href="index.html" style="text-decoration:none;">🏠 Voltar</a>
  </div>

  <div class="game-shell">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="controls" role="group" aria-label="Controles de toque">
    <button class="ctrl-btn" id="leftBtn" type="button">◀</button>
    <button class="ctrl-btn" id="rightBtn" type="button">▶</button>
  </div>

  <div class="user-info" id="userInfo">
    👤 <strong id="playerName">Carregando...</strong>
  </div>

  <div class="gameover" id="gameOverPanel">
    <div class="gameover-card">
      <h2>💀 Fim de jogo</h2>
      <p id="finalScoreText">Pontuação: 0</p>
      <button class="btn" id="restartBtn" type="button">🔄 Jogar novamente</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

  <script>
    // ===== CONFIGURAÇÃO FIREBASE =====
    const firebaseConfig = {
      apiKey: "AIzaSyCSXdOu9Cwly0-s9rySbe9jKb7fqhcz1p8",
      authDomain: "jackbarcafe-b8fa8.firebaseapp.com",
      projectId: "jackbarcafe-b8fa8",
      storageBucket: "jackbarcafe-b8fa8.appspot.com",
      messagingSenderId: "849215333925",
      appId: "1:849215333925:web:e02cb0d11c590af32201cc"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== VARIÁVEIS =====
    let userId = null;
    let userNome = 'Anônimo';
    let userDataLoaded = false;

    // ===== ELEMENTOS DOM =====
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const rankingList = document.getElementById('rankingList');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const playerNameEl = document.getElementById('playerName');

    // ===== JOGO =====
    let score = 0;
    let speed = 2;
    let gameOver = false;
    let paused = false;
    let lastSpawnAt = 0;
    const SPAWN_INTERVAL_MS = 1200;

    const player = { x: 175, y: 520, w: 50, h: 80, color: '#ff0000' };
    const cars = [];

    let leftPressed = false;
    let rightPressed = false;
    let pointerActive = false;

    // ===== RANKING =====
    async function carregarRanking() {
      try {
        const snapshot = await db.collection('gameScores')
          .orderBy('score', 'desc')
          .limit(10)
          .get();

        rankingList.innerHTML = '';

        if (snapshot.empty) {
          rankingList.innerHTML = '<li class="rank-empty">Nenhuma pontuação ainda.<br>Seja o primeiro! 🎮</li>';
          return;
        }

        let pos = 1;
        snapshot.forEach(doc => {
          const data = doc.data();
          const nome = data.nome || 'Anônimo';
          const scoreValue = data.score || 0;
          const li = document.createElement('li');
          li.setAttribute('data-pos', pos);

          let medal = '';
          if (pos === 1) medal = '🥇 ';
          else if (pos === 2) medal = '🥈 ';
          else if (pos === 3) medal = '🥉 ';

          li.innerHTML = `
            <span class="rank-player"><span class="rank-medal">${medal}</span>${nome}</span>
            <span class="rank-score">${scoreValue}</span>
          `;
          rankingList.appendChild(li);
          pos++;
        });
      } catch (err) {
        console.error('❌ Erro ao carregar ranking:', err);
        rankingList.innerHTML = '<li class="rank-empty">❌ Erro ao carregar ranking</li>';
      }
    }

    // ===== SALVAR PONTUAÇÃO =====
    async function salvarPontuacao(scoreValue) {
      if (!userId) {
        console.warn('⚠️ Usuário não autenticado');
        return;
      }

      try {
        const docRef = db.collection('gameScores').doc(userId);
        const doc = await docRef.get();
        const currentScore = doc.exists ? doc.data().score : 0;

        if (scoreValue > currentScore) {
          await docRef.set({
            score: scoreValue,
            nome: userNome,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          console.log('✅ Nova pontuação salva!', scoreValue);
        } else {
          console.log('ℹ️ Pontuação não superou o recorde anterior');
        }
      } catch (err) {
        console.error('❌ Erro ao salvar pontuação:', err);
      }
    }

    // ===== AUTENTICAÇÃO =====
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        userId = user.uid;
        console.log('👤 Usuário autenticado:', userId);

        // Busca nome do usuário
        try {
          const doc = await db.collection('users').doc(userId).get();
          if (doc.exists) {
            const data = doc.data();
            userNome = data.nome || data.email || 'Anônimo';
          }
        } catch (err) {
          console.warn('⚠️ Erro ao buscar nome:', err);
        }

        playerNameEl.textContent = userNome;
        userDataLoaded = true;

        // Carrega ranking
        carregarRanking();

        // Listener em tempo real
        db.collection('gameScores')
          .orderBy('score', 'desc')
          .limit(10)
          .onSnapshot(() => {
            carregarRanking();
          });

      } else {
        console.log('👤 Usuário não autenticado');
        playerNameEl.textContent = 'Anônimo (faça login)';
        
        // Tenta login anônimo
        try {
          await auth.signInAnonymously();
        } catch (e) {
          console.error('❌ Falha no login anônimo:', e);
        }
      }
    });

    // ===== JOGO =====

    function resetGame() {
      score = 0;
      speed = 2;
      gameOver = false;
      paused = false;
      lastSpawnAt = 0;
      cars.length = 0;
      player.x = 175;
      player.y = 520;
      scoreEl.textContent = '🏁 0';
      gameOverPanel.style.display = 'none';
      pauseBtn.textContent = '⏸️ Pausar';
      requestAnimationFrame(loop);
    }

    function spawnCar() {
      const colors = ['#2196F3', '#4CAF50', '#FF9800', '#9C27B0'];
      const car = {
        x: Math.random() * 350,
        y: -100,
        w: 45,
        h: 75,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
      cars.push(car);
    }

    function movePlayer() {
      if (leftPressed) player.x -= 5;
      if (rightPressed) player.x += 5;
      player.x = Math.max(0, Math.min(350, player.x));
    }

    function update() {
      if (gameOver || paused) return;

      movePlayer();
      score++;
      scoreEl.textContent = `🏁 ${score}`;
      speed = 2 + Math.floor(score / 200);

      for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i];
        car.y += speed;

        if (car.y > 600) {
          cars.splice(i, 1);
          continue;
        }

        if (
          car.x < player.x + player.w &&
          car.x + car.w > player.x &&
          car.y < player.y + player.h &&
          car.y + car.h > player.y
        ) {
          gameOver = true;
          finalScoreText.textContent = `Pontuação: ${score}`;
          gameOverPanel.style.display = 'flex';
          salvarPontuacao(score);
          break;
        }
      }
    }

    function drawRoadGuides() {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(130, 0, 6, canvas.height);
      ctx.fillRect(264, 0, 6, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      const dashH = 24;
      const gap = 16;
      const offset = (score * 0.8) % (dashH + gap);
      for (let y = -dashH; y < canvas.height + dashH; y += dashH + gap) {
        ctx.fillRect(197, y + offset, 6, dashH);
      }
    }

    function drawCarRect(obj, color) {
      // Sombra
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(obj.x, obj.y, obj.w, obj.h, 6);
      ctx.fill();
      
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Faróis
      ctx.fillStyle = 'rgba(255,255,200,0.6)';
      ctx.fillRect(obj.x + 8, obj.y + 6, 8, 6);
      ctx.fillRect(obj.x + obj.w - 16, obj.y + 6, 8, 6);
      
      // Janela traseira
      ctx.fillStyle = 'rgba(100,150,255,0.3)';
      ctx.fillRect(obj.x + 10, obj.y + 20, obj.w - 20, 20);
      
      // Faróis traseiros
      ctx.fillStyle = 'rgba(255,0,0,0.5)';
      ctx.fillRect(obj.x + 8, obj.y + obj.h - 10, 8, 6);
      ctx.fillRect(obj.x + obj.w - 16, obj.y + obj.h - 10, 8, 6);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Fundo da pista
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(0.5, '#16213e');
      grad.addColorStop(1, '#0f3460');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      drawRoadGuides();

      drawCarRect(player, player.color);
      for (const car of cars) drawCarRect(car, car.color);

      if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ PAUSADO', canvas.width / 2, canvas.height / 2);
      }
    }

    // Polyfill para roundRect
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    function loop(ts) {
      if (gameOver) {
        draw();
        return;
      }

      if (!paused) {
        if (!lastSpawnAt) lastSpawnAt = ts;
        if (ts - lastSpawnAt >= SPAWN_INTERVAL_MS) {
          spawnCar();
          lastSpawnAt = ts;
        }
        update();
      }

      draw();
      requestAnimationFrame(loop);
    }

    // ===== CONTROLES =====

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') leftPressed = true;
      if (e.key === 'ArrowRight') rightPressed = true;
      if (e.key.toLowerCase() === 'p') togglePause();
    });

    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') leftPressed = false;
      if (e.key === 'ArrowRight') rightPressed = false;
    });

    function bindHoldButton(btn, setter) {
      const on = (ev) => { ev.preventDefault(); setter(true); };
      const off = (ev) => { ev.preventDefault(); setter(false); };
      ['pointerdown','touchstart','mousedown'].forEach(evt => btn.addEventListener(evt, on, { passive: false }));
      ['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(evt => btn.addEventListener(evt, off, { passive: false }));
    }

    bindHoldButton(document.getElementById('leftBtn'), v => { leftPressed = v; if (v) rightPressed = false; });
    bindHoldButton(document.getElementById('rightBtn'), v => { rightPressed = v; if (v) leftPressed = false; });

    function pointerToCanvasX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      return Math.max(0, Math.min(canvas.width, x));
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerActive = true;
      canvas.setPointerCapture?.(e.pointerId);
      const x = pointerToCanvasX(e.clientX);
      player.x = Math.max(0, Math.min(350, x - player.w / 2));
      e.preventDefault();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointerActive) return;
      const x = pointerToCanvasX(e.clientX);
      player.x = Math.max(0, Math.min(350, x - player.w / 2));
      e.preventDefault();
    });

    canvas.addEventListener('pointerup', () => { pointerActive = false; });
    canvas.addEventListener('pointercancel', () => { pointerActive = false; });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶️ Continuar' : '⏸️ Pausar';
    }

    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);

    // ===== INICIAR =====
    carregarRanking();
    requestAnimationFrame(loop);
